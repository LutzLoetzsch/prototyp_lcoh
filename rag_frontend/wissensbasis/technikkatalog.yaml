# Hinweise
# ---------------------------------------------------------------------------
_hinweise:
  - >
    Diese Datei ist eine ÜBERFÜHRUNG aus K07, keine Neuerhebung. Werte, die
    K07 nicht mit Tab-Bezug führt, stehen hier nicht. Insbesondere fehlen
    Nutzungsgrade für Heizöl, Kohle, Strom-Direktheizung und Fernwärme im
    Gebäudebestand — sie sind für die η-Herleitung aus dem Zensus-Mix
    erforderlich und bislang unbelegt.
  - >
    VERSIONSKONFLIKT: K07 zitiert v1.1 (Aug 2024), K06 zitiert die Fassung
    Dezember 2025. Vor der Textproduktion zu klären, welche Fassung
    maßgeblich ist. Die Tab-Nummern hier folgen K07.
  - >
    Der Katalog-Disclaimer (bundesweite Durchschnittswerte, lokal erheblich
    abweichend) gehört in jede Antwort, die sich auf diese Werte stützt. Er
    ist Teil des Quellennachweises, nicht eine Fußnote.
