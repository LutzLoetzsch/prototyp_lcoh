_meta:
  name: "KWW-Technikkatalog Wärmeplanung"
  version: "v1.1 (Aug 2024)"
  stuetzjahr: 2023
  waehrung: "EUR 2023, netto"
  lizenz: "CC-BY"
  geltungsrahmen: >
    Bundesweite Durchschnittswerte. Der Katalog weist ausdrücklich darauf hin,
    dass tatsächliche Kosten lokal erheblich abweichen und im Einzelfall zu
    prüfen sind. Spannen sind die Bandbreite über die tabellierten
    Leistungsklassen.
  herkunft_dieser_datei: >
    Übernommen aus K07 (Domänen- und Modellspezifikation), dort mit Tab- und
    Zeilenbezug gepinnt. Keine Neuerhebung aus der Katalog-Excel.

