

_meta:
  name: "Weisswasser (Lausitz, Strukturwandel)"
  bundesland: "Sachsen"
  rolle_im_design: >
    Maximum-Variation-Fall 2: NICHT-MONOTON. Haushaltssegment sinkt, Industrie
    kommt als Neuansiedlung mit Grossanschluss hinzu. Zeigt, warum zwei Segmente,
    beide Richtungen und eine explizite Jahresreihe (nicht nur eine Rate) noetig
    sind -- der anspruchsvollste Trajektorienfall.
  betrachtungszeitraum: { wert: 20, einheit: "a", quelle: "", status: annahme }
  ff3_vorbehalt: >
    Die Anlage ist auf den Anfangsbedarf ausgelegt; der spaetere Grossanschluss
    wird ohne gestufte Kapazitaetserweiterung bedient -- das LCOH-Ergebnis ist
    daher die OPTIMISTISCHE GRENZE des Wachstumsfalls (als Grenze auszuweisen).

# ---------------------------------------------------------------------------
# 1 STAMMDATEN
# ---------------------------------------------------------------------------
stammdaten:
  einwohner:
    wert: null
    einheit: "EW"
    quelle: "Zensus 2022 (Gemeinde) / StLA Sachsen"
    status: zu_beschaffen   # AUFTRAG A -- offen, vorgesehen fuer G1b

# ---------------------------------------------------------------------------
# 2 WAERMEBEDARF — AUFTRAG 1 (entscheidungswirksam, §6). Zwei Segmente, nicht-monoton.
# ---------------------------------------------------------------------------
waermebedarf:
  segment_haushalt:
    q0:
      wert: 89330.0
      einheit: "MWh/a"
      quelle: "ILLUSTRATIV -- Groessenordnung aus G1a: Versorgungsgebiet Weisswasser
               95.830 MWh/a (Hotmaps heat_tot 2015, CC BY 4.0, DOI 10.5281/zenodo.4687129,
               korrigiert mit eta=0,87) abzueglich Industriebestand 600 MWh/a.
               KEIN belegter Segmentwert: Hotmaps heat_tot trennt nicht nach Sektor.
               Belegbar ueber heat_res_curr_density (Wohngebaeude) -- offen."
      status: illustrativ
    rate:
      wert: -1.2
      einheit: "%/a"
      quelle: "9. RBV Sachsen (StLA, 07.05.2026, Lausitz stark ruecklaeufig) + dena 2026 Abb. 76; sinngemaess"
      status: belegt
  segment_industrie:       # NICHT-MONOTON -> explizite Reihe, nicht als Rate abbildbar
    typ: "neuansiedlung_mit_stufe"
    # ILLUSTRATIV 2026-08-07: Die vier folgenden Werte sind die Codewerte aus den
    # urspruenglichen Kommentaren. Sie werden gesetzt, damit der nicht-monotone
    # Reihenpfad (profil.bedarfsreihe_aus_profil) ueberhaupt rechenbar wird und
    # der Betrachtungszeitraum aus _meta uebergeben wird.
    # KEINE Kommunenwerte. Ansiedlungsplanung ist lokale Planungsinformation und
    # in keiner oeffentlichen Quelle enthalten -- das ist eine FF3-Grenze und
    # als solche zu berichten, nicht zu kaschieren.
    bestand_vor_anschluss:
      wert: 600.0
      einheit: "MWh/a"
      quelle: ""
      status: illustrativ
    neu_ab_anschluss:
      wert: 6500.0
      einheit: "MWh/a"
      quelle: ""
      status: illustrativ
    anschlussjahr:
      wert: 4
      einheit: "Jahr im Betrachtungszeitraum"
      quelle: ""
      status: illustrativ
    wachstumsrate:
      wert: 1.0
      einheit: "%/a"
      quelle: ""
      status: illustrativ

