  haushaltsrate:
    wert: -1.2
    einheit: "%/a"
    quelle: "9. RBV Sachsen + dena 2026 Abb. 76; sinngemaess"
    status: belegt

# ---------------------------------------------------------------------------
# 4 NETZ — AUFTRAG 2 (Q_l/Anschlussgrad) + AUFTRAG 4 (Foerderung)
# ---------------------------------------------------------------------------
netz:
  terrain:
    wert: "laendlich/flach (Lausitz)"
    einheit: "-"
    quelle: "Einordnung Lausitz, flaches Terrain"
    status: annahme
  investition_eur_pro_m:
    wert: null            # belegt via TK-Formel; Wert folgt aus Leistungsklasse P (aus Q0/VLh)
    einheit: "EUR/m"
    quelle: "KWW-TK v1.1, Tab 42, Z. 25 (Hauptleitung unbefestigt/laendlich 692-2459) bzw. Z. 10-12 (a*P^b, a=284.93, b=0.2001); sinngemaess"
    status: belegt        # Zwei-Faktor-Form: c_d = netz_invest / Q_l; Q_l bleibt frei (Auftrag 2, Befund 2 = a)
  netzkosten_validierungsanker:
    wert: 739
    einheit: "EUR/(MWh*a)"
    quelle: "KWW-TK v1.1, Tab 42, Z. 17 (laendlich = Gesamtkosten/Jahreswaermemenge, Anm. E); sinngemaess"
    status: belegt        # VALIDIERUNG, KEIN Input: Modell-c_d bei Referenzdichte muss ~739 treffen
  waermeliniendichte_ql:
    wert: null
    einheit: "MWh/(m*a)"
    quelle: "GIS/Siedlungsgeometrie; kommunale Waermeplanung"
    status: zu_beschaffen
    # 2026-08-07: BEWUSST auf null. Q_l wird seit G1a im dss aus
    # trassenlaenge_m und waermelieferung_mwh_a hergeleitet
    # (cli_entscheidung.HERLEITUNG). Ein Wert hier wuerde die Herleitung
    # ueberschreiben (profil.py bildet dieses Feld direkt auf den
    # M6-Parameter waermeliniendichte ab).
    # Abgeleiteter Wert zur Einordnung: 2,8710 MWh/(m*a) -- Obergrenze.
  anschlussgrad:
    wert: null              # AUFTRAG 2 (Teil)
    einheit: "%"
    quelle: "kommunale Waermeplanung"
    status: zu_beschaffen
    # FF3/FF4: bewusst NICHT aus Hotmaps korrigiert. Der Anschlussgrad ist
    # keine Dateneigenschaft, sondern eine kommunale PLANUNGSGROESSE und
    # gehoert als Szenarioachse in die Auswertung. Solange er offen ist,
    # sind trassenlaenge_m/waermelieferung_mwh_a eine Obergrenze
    # (Persson & Werner 2011, S. 573: Modell unterstellt 100 % Anschluss).
  verlustanteil:
    wert: 16.0
    einheit: "%"
    quelle: "KWW-TK v1.1, Tab 42: Leitung 12,3 % (Z. 8) + Uebergabe 4,5 % (Z. 11); sinngemaess"
    status: belegt
  lebensdauer:
    wert: 40
    einheit: "a"
    quelle: "KWW-TK v1.1, Tab 42, Z. 14; sinngemaess"
    status: belegt
  trassenlaenge_m:
    wert: 33379.3
    einheit: "m"
    quelle: "Hotmaps heat_tot/gfa_tot (2015, CC BY 4.0, DOI 10.5281/zenodo.4687129);
             effektive Breite je Hektarzelle nach Persson & Werner (2011), S. 571 Gl. (8);
             Gebietsabgrenzung plot ratio >= 0.15, ebd. S. 574;
             Gemeindeumriss VG250 GF=4, Gebietsstand 15.05.2022 (BKG);
             251 qualifizierende Hektarzellen"
    status: hergeleitet
  waermelieferung_mwh_a:
    wert: 95830.5
    einheit: "MWh/a"
    quelle: "Hotmaps heat_tot_curr_density (2015, Endenergie), Rohsumme 110.150 MWh/a
             ueber 251 Hektarzellen; korrigiert x0.8700 (Gesamtfaktor 0.8700);
             K1 Endenergie->Nutzwaerme eta=0.87 (M6-Band 0,82..0,92, Mitte; ANNAHME,
             belegbar ueber Energietraegermix Zensus 2022);
             K2 nicht angewandt -- nicht-monotone Trajektorie, Korrektur ueber
             bedarfsreihe. Bezugsjahr des Werts ist 2015."
    status: hergeleitet

