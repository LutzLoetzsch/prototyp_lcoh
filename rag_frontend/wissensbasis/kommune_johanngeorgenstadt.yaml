# ---------------------------------------------------------------------------
# 7 POTENZIAL (Sinnhaftigkeits-Grundlage für die LLM-Szenariowahl)
# ---------------------------------------------------------------------------
potenzial:
  grubenwasser:
    wert: "vorhanden (ehem. Bergbau)"
    quelle: "TU Bergakademie Freiberg; WHZ Zwickau"
    status: belegt          # -> S3 stark (✓✓)
  biomasse:
    wert: "begrenzt"
    quelle: >
      Kompare 2026, Abschn. 6.4 (in 69 % der Kommunen übersteigt der Bedarf
      2045 das örtliche Potenzial); sinngemäß. Ergänzend Bundeswaldinventur.
    status: belegt          # -> S1 eher Spitzenlast, nicht Grundlast
  solarstrahlung:
    wert: null
    einheit: "kWh/(m2*a)"
    quelle: "DWD-Strahlungsdaten / SAENA — nur falls S5-Zelle aktiv"
    status: zu_beschaffen   # Erwartung: Relief/Strahlung -> S5 Kandidat "nicht sinnvoll"


